<title>UCL Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* === TOKENS — dark-first === */
:root {
  --bg:   #020A1C;
  --bg2:  #05102A;
  --sfc:  #0B1532;
  --sfc2: #0F1E40;
  --gold: #F5C518;
  --gsft: rgba(245,197,24,.12);
  --gbrd: rgba(245,197,24,.22);
  --txt:  #fff;
  --t2:   #8899B4;
  --t3:   #4A5A7A;
  --grn:  #10B981;
  --red:  #EF4444;
  --ylw:  #F59E0B;
  --blu:  #3B82F6;
  --brd:  rgba(255,255,255,.07);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #0D1B3E; --bg2: #102040; --sfc: #132050; --sfc2: #172860;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] { color-scheme: dark; }

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  background: var(--bg);
  color: var(--txt);
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh;
  padding-left: max(0px, env(safe-area-inset-left,0px));
  padding-right: max(0px, env(safe-area-inset-right,0px));
}

/* === HEADER === */
.site-header {
  position: sticky;
  top: env(safe-area-inset-top,0px);
  z-index: 50;
  background: rgba(2,10,28,.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--brd);
  padding: 12px max(16px, env(safe-area-inset-left,0px));
  display: flex; align-items: center; gap: 12px;
}
.site-header h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.1rem; font-weight: 700; letter-spacing: .02em;
}
.site-header h1 span { color: var(--gold); }
.badge-ucl {
  background: var(--gsft);
  border: 1px solid var(--gbrd);
  border-radius: 6px;
  padding: 2px 8px;
  font-size: .68rem; font-weight: 600;
  color: var(--gold); letter-spacing: .08em;
}
.header-date { margin-left: auto; color: var(--t2); font-size: .78rem; }

/* === BANCA BARS === */
.banca-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 12px max(16px, env(safe-area-inset-left,0px));
  background: var(--bg2);
  border-bottom: 1px solid var(--brd);
}
.banca-card {
  background: var(--sfc);
  border: 1px solid var(--brd);
  border-radius: 10px;
  padding: 10px 12px;
}
.banca-card.gold { border-color: var(--gbrd); background: var(--gsft); }
.banca-label { font-size: .68rem; color: var(--t2); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }
.banca-amount {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.25rem; font-weight: 800;
  color: var(--gold); margin-top: 2px;
}
.banca-sub { font-size: .72rem; color: var(--t2); margin-top: 1px; }

/* === TABS === */
.tabs {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--brd);
  background: var(--bg2);
  padding: 0 max(16px, env(safe-area-inset-left,0px));
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0;
  background: none; border: none; cursor: pointer;
  padding: 10px 16px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: .82rem; font-weight: 600;
  color: var(--t2);
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
}
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
.tab-btn:hover:not(.active) { color: var(--txt); }

/* === MAIN CONTENT === */
.main { padding: 16px max(16px, env(safe-area-inset-left,0px)); max-width: 900px; margin: 0 auto; }
.pane { display: none; }
.pane.active { display: block; }

/* === MATCH CARD === */
.match-card {
  background: var(--sfc);
  border: 1px solid var(--brd);
  border-radius: 12px;
  margin-bottom: 12px;
  overflow: hidden;
}
.match-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--brd);
  background: var(--bg2);
}
.match-time {
  font-size: .72rem; color: var(--gold);
  background: var(--gsft); border: 1px solid var(--gbrd);
  border-radius: 5px; padding: 2px 6px; font-weight: 600;
  flex-shrink: 0;
}
.match-teams {
  font-family: 'Space Grotesk', sans-serif;
  font-size: .95rem; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
  flex: 1; min-width: 0;
}
.team-block { display: flex; align-items: center; gap: 7px; min-width: 0; }
.team-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vs-badge {
  font-size: .65rem; color: var(--t3);
  font-weight: 700; letter-spacing: .06em;
  flex-shrink: 0;
}
.team-crest {
  width: 26px; height: 26px; border-radius: 50%;
  object-fit: contain; background: var(--sfc2);
  flex-shrink: 0;
}
.crest-fallback {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Space Grotesk', sans-serif;
  font-size: .6rem; font-weight: 800;
  flex-shrink: 0; color: #fff;
}

/* 1X2 odds row */
.odds-row {
  display: flex; gap: 6px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--brd);
}
.odd-btn {
  flex: 1; background: var(--sfc2); border: 1px solid var(--brd);
  border-radius: 7px; padding: 7px 4px;
  cursor: pointer; transition: all .15s;
  text-align: center;
}
.odd-btn:hover { border-color: var(--t2); }
.odd-label { font-size: .62rem; color: var(--t2); font-weight: 500; display: block; }
.odd-val { font-family: 'Space Grotesk', sans-serif; font-size: .95rem; font-weight: 700; display: block; }

/* Markets accordion */
.markets-toggle {
  width: 100%; background: none; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px;
  color: var(--t2); font-size: .78rem; font-weight: 500;
  transition: color .15s;
}
.markets-toggle:hover { color: var(--txt); }
.markets-toggle .arrow { transition: transform .2s; }
.markets-toggle.open .arrow { transform: rotate(180deg); }
.markets-body { display: none; padding: 0 14px 10px; }
.markets-body.open { display: block; }
.market-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid var(--brd);
}
.market-row:last-child { border: none; }
.market-name { font-size: .78rem; color: var(--t2); flex: 1; min-width: 0; }
.market-odds { display: flex; gap: 5px; flex-shrink: 0; }
.mkt-opt {
  background: var(--sfc2); border: 1px solid var(--brd);
  border-radius: 5px; padding: 3px 8px; cursor: pointer;
  font-size: .75rem; font-weight: 600; transition: all .15s;
  white-space: nowrap;
}
.mkt-opt.hl { border-color: var(--gold); color: var(--gold); background: var(--gsft); }
.mkt-opt:hover { border-color: var(--t2); }

/* === RECOMMENDATION PILL === */
.rec-block {
  margin: 0 14px 12px;
  border-radius: 8px;
  padding: 10px 12px;
  border: 1px solid;
}
.rec-block.low { border-color: rgba(16,185,129,.3); background: rgba(16,185,129,.06); }
.rec-block.medium { border-color: rgba(245,158,11,.3); background: rgba(245,158,11,.06); }
.rec-block.high { border-color: rgba(239,68,68,.3); background: rgba(239,68,68,.06); }
.rec-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.rec-pick {
  font-family: 'Space Grotesk', sans-serif;
  font-size: .88rem; font-weight: 700;
}
.rec-odds {
  margin-left: auto; font-family: 'Space Grotesk', sans-serif;
  font-size: 1rem; font-weight: 800; color: var(--gold);
}
.risk-pill {
  font-size: .62rem; font-weight: 700; border-radius: 4px;
  padding: 2px 6px; letter-spacing: .06em;
}
.risk-low { background: rgba(16,185,129,.18); color: var(--grn); }
.risk-medium { background: rgba(245,158,11,.18); color: var(--ylw); }
.risk-high { background: rgba(239,68,68,.18); color: var(--red); }
.rec-analysis { font-size: .78rem; color: var(--t2); line-height: 1.5; }

/* === RETO 5/5 === */
.reto-header {
  background: linear-gradient(135deg, #0B1532, #1A1040);
  border: 1px solid var(--gbrd);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  text-align: center;
}
.reto-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.3rem; font-weight: 800;
  color: var(--gold);
}
.reto-subtitle { color: var(--t2); font-size: .82rem; margin-top: 4px; }
.reto-math {
  display: flex; align-items: center; justify-content: center; gap: 20px;
  margin-top: 14px; flex-wrap: wrap;
}
.reto-stat { text-align: center; }
.reto-stat-val {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.5rem; font-weight: 800; color: var(--txt);
}
.reto-stat-val.gold { color: var(--gold); }
.reto-stat-lbl { font-size: .68rem; color: var(--t2); margin-top: 2px; }
.reto-pick-card {
  background: var(--sfc);
  border: 1px solid var(--brd);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 12px;
}
.pick-num {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--gsft); border: 1px solid var(--gbrd);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Space Grotesk', sans-serif;
  font-size: .78rem; font-weight: 800; color: var(--gold);
  flex-shrink: 0;
}
.pick-info { flex: 1; min-width: 0; }
.pick-teams { font-family: 'Space Grotesk', sans-serif; font-size: .9rem; font-weight: 700; }
.pick-bet { font-size: .78rem; color: var(--t2); margin-top: 2px; }
.pick-odds-val {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.1rem; font-weight: 800; color: var(--gold);
  flex-shrink: 0;
}
.result-btns { display: flex; gap: 5px; flex-shrink: 0; }
.rbtn {
  width: 30px; height: 30px; border-radius: 6px;
  border: 1px solid var(--brd);
  background: var(--sfc2); cursor: pointer;
  font-size: .85rem; transition: all .15s;
  display: flex; align-items: center; justify-content: center;
}
.rbtn:hover { transform: scale(1.08); }
.rbtn.win.active { background: rgba(16,185,129,.25); border-color: var(--grn); }
.rbtn.loss.active { background: rgba(239,68,68,.25); border-color: var(--red); }
.pick-status { font-size: .72rem; font-weight: 600; }
.pick-status.win { color: var(--grn); }
.pick-status.loss { color: var(--red); }
.pick-status.pending { color: var(--t3); }

/* === PRINCIPAL PICKS === */
.prin-header {
  background: linear-gradient(135deg, #0A1A0E, #0E2A18);
  border: 1px solid rgba(16,185,129,.3);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  text-align: center;
}
.prin-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.1rem; font-weight: 800; color: var(--grn);
}
.prin-pick-card {
  background: var(--sfc);
  border: 1px solid var(--brd);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 8px;
}
.prin-pick-top { display: flex; align-items: center; gap: 12px; }
.prin-stake {
  font-size: .72rem; color: var(--t2); margin-top: 4px;
  display: flex; gap: 12px;
}
.stake-val { font-weight: 600; color: var(--txt); }
.potential-val { font-weight: 600; color: var(--grn); }

/* === BANCA DETAIL PAGE === */
.banca-detail {
  background: var(--sfc);
  border: 1px solid var(--brd);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
.banca-detail h3 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1rem; font-weight: 700; margin-bottom: 12px;
}
.banca-progress-bar {
  height: 8px; border-radius: 4px;
  background: var(--sfc2);
  margin: 8px 0 4px;
  overflow: hidden;
}
.banca-progress-fill {
  height: 100%; border-radius: 4px;
  background: linear-gradient(90deg, var(--gold), #FFE066);
  transition: width .4s ease;
}
.banca-nums {
  display: flex; justify-content: space-between;
  font-size: .75rem; color: var(--t2);
}

/* === ANALYSIS PAGE === */
.analysis-card {
  background: var(--sfc);
  border: 1px solid var(--brd);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
}
.analysis-match {
  font-family: 'Space Grotesk', sans-serif;
  font-size: .95rem; font-weight: 700;
  color: var(--gold);
  margin-bottom: 8px;
}
.analysis-text { font-size: .82rem; color: var(--t2); line-height: 1.6; }

/* === SECTION LABEL === */
.section-label {
  font-size: .68rem; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--t3);
  padding: 10px 0 6px;
}

/* === RESPONSIVE === */
@media (max-width: 480px) {
  .match-teams { font-size: .82rem; }
  .reto-math { gap: 14px; }
  .banca-row { grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 12px; }
  .banca-amount { font-size: 1rem; }
}
</style>

function fmt(n) {
  return '$' + Math.round(n).toLocaleString('es-CO').replace(/,/g,'.');
}

function crestUrl(fdId) {
  if(!fdId) return null;
  return `https://crests.football-data.org/${fdId}.png`;
}

function teamHtml(t) {
  if(t.fdId) {
    return `<img class="team-crest" src="${crestUrl(t.fdId)}" alt="${t.name}"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <span class="crest-fallback" style="background:${t.color};display:none">${t.abbr.slice(0,2)}</span>`;
  }
  return `<span class="crest-fallback" style="background:${t.color}">${t.abbr.slice(0,2)}</span>`;
}

function riskHtml(r) {
  return `<span class="risk-pill risk-${r}">${r==='low'?'BAJO':r==='medium'?'MEDIO':'ALTO'}</span>`;
}

// Recalculate bancas from scratch based on results
function recalcBancas() {
  // Stakes already placed — start deducted, return on W
  const prinStakes = PRIN_PICKS.reduce((s,p)=>s+p.stake,0);
  const extraStakes = EXTRA_PICKS.filter(p=>STATE.extra[p.id]).reduce((s,p)=>s+p.stake,0);
  const bigStakes = BIG_BETS.reduce((s,b)=>s+b.stake,0);
  let bk1 = 50000 - prinStakes - extraStakes - bigStakes;
  for(const p of PRIN_PICKS) {
    const r = STATE.prin[p.matchId];
    if(r==='W') bk1 += p.stake*p.odds;
  }
  for(const p of EXTRA_PICKS) {
    const r = STATE.extra[p.id];
    if(r==='W') bk1 += p.stake*p.odds;
  }
  for(const b of BIG_BETS) {
    const r = STATE.big[b.id];
    const combined = b.picks.reduce((a,p)=>a*p.odds,1);
    if(r==='W') bk1 += b.stake*combined;
  }
  STATE.bk1 = Math.max(0, bk1);

  const wins = RETO_PICKS.filter(p=>STATE.reto[p.matchId]==='W').length;
  const losses = RETO_PICKS.filter(p=>STATE.reto[p.matchId]==='L').length;
  if(losses > 0) {
    STATE.bk2 = Math.max(0, 50000 - RETO_STAKE);
  } else if(wins === RETO_PICKS.length) {
    STATE.bk2 = 50000 - RETO_STAKE + RETO_STAKE * RETO_COMBINED;
  } else {
    STATE.bk2 = 50000 - RETO_STAKE; // stake placed, pending
  }
}

function updateBancaDisplay() {
  document.getElementById('bk1-display').textContent = fmt(STATE.bk1);
  document.getElementById('bk2-display').textContent = fmt(STATE.bk2);
}

      <div style="font-size:.82rem;color:var(--t2);margin-bottom:12px">$50.000 → $500.000 COP · Singles 5% banca</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:800">${fmt(STATE.bk1)}</span>
        <span style="font-size:.78rem;color:var(--t2)">${prinWins} ganados · ${prinLoss} perdidos</span>
      </div>
      <div class="banca-progress-bar" style="height:6px">
        <div class="banca-progress-fill" style="width:${Math.max(2,(STATE.bk1/500000)*100)}%;background:linear-gradient(90deg,var(--grn),#6EE7B7)"></div>
      </div>
      <div class="banca-nums"><span>${fmt(50000)}</span><span>${fmt(500000)}</span></div>
      <div style="margin-top:12px">
        <div class="section-label" style="padding-top:4px">Apuestas singles esta jornada</div>
        ${PRIN_PICKS.map(p=>{
          const r = STATE.prin[p.matchId];
          const profit = r==='W'? p.stake*(p.odds-1) : r==='L'? -p.stake : 0;
          return `<div class="prin-pick-card" style="margin-bottom:6px">
            <div class="prin-pick-top">
              <div class="pick-info">
                <div class="pick-teams">${p.teams}</div>
                <div class="pick-bet">${p.bet}</div>
              </div>
              <span class="pick-status ${r==='W'?'win':r==='L'?'loss':'pending'}">${r==='W'?'GANÓ':r==='L'?'PERDIÓ':'⏳'}</span>
              <span class="pick-odds-val">${p.odds.toFixed(2)}</span>
              <div class="result-btns">
                <button class="rbtn win ${r==='W'?'active':''}" onclick="setResult('prin','${p.matchId}','W')">✓</button>
                <button class="rbtn loss ${r==='L'?'active':''}" onclick="setResult('prin','${p.matchId}','L')">✗</button>
              </div>
            </div>
            <div class="prin-stake">
              Stake: <span class="stake-val">${fmt(p.stake)}</span>
              Potencial: <span class="potential-val">${fmt(p.stake*p.odds)}</span>
              ${r?`<span style="font-weight:600;color:${profit>=0?'var(--grn)':'var(--red)'}">${profit>=0?'+':''}${fmt(profit)}</span>`:''}
            </div>
          </div>`;
        }).join('')}
      </div>
      <div style="background:var(--sfc2);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:.8rem;color:var(--t2)">
        Si todas las singles ganan hoy: <strong style="color:var(--grn)">${fmt(50000+PRIN_PICKS.reduce((s,p)=>s+p.stake*(p.odds-1),0))}</strong>
        (+${fmt(PRIN_PICKS.reduce((s,p)=>s+p.stake*(p.odds-1),0))})
      </div>
    </div>

    <button onclick="resetState()" style="width:100%;margin-top:8px;background:none;border:1px solid var(--t3);border-radius:8px;padding:10px;color:var(--t2);font-size:.8rem;cursor:pointer">
      Reiniciar todos los resultados
    </button>
  `;
}

// ═══════════════════════════════════════════════════
//  RESULT HANDLER
// ═══════════════════════════════════════════════════
function setResult(type, matchId, val) {
  if(STATE[type][matchId]===val) {
    delete STATE[type][matchId];
  } else {
    STATE[type][matchId] = val;
  }
  recalcBancas();
  saveState();
  updateBancaDisplay();
  // Re-render active pane
  const active = document.querySelector('.pane.active').id.replace('pane-','');
  renderPane(active);
}

function resetState() {
  if(!confirm('¿Reiniciar todos los resultados?')) return;
  STATE = {bk1:50000, bk2:50000, reto:{}, prin:{}, extra:{}, big:{}};
  saveState();
  updateBancaDisplay();
  renderPane('banca');
}

// ═══════════════════════════════════════════════════
//  RENDER: COMBINADAS / EXTRAS
// ═══════════════════════════════════════════════════
function renderExtras() {
  const container = document.getElementById('pane-extras');
  const groups = [
    {key:'jugadores',  label:'Props de Jugador — PSG vs Roma', color:'var(--blu)'},
    {key:'combinada2', label:'Combinadas x2',                  color:'var(--ylw)'},
    {key:'combinada3', label:'Combinadas x3',                  color:'var(--gold)'},
  ];

  let html = `<div class="section-label">Apuestas adicionales usando todos los mercados disponibles</div>
  <div style="background:var(--sfc);border:1px solid var(--brd);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.8rem;color:var(--t2)">
    Estas apuestas van a la <strong style="color:var(--grn)">Banca Principal</strong>.
    Marca ✓ las que coloques — el stake se descuenta y el retorno se suma si ganas.
    <strong style="color:var(--ylw)">Solo coloca las que ya hayas apostado.</strong>
  </div>`;

  for(const g of groups) {
    const picks = EXTRA_PICKS.filter(p=>p.group===g.key);
    html += `<div class="section-label" style="color:${g.color};margin-top:8px">${g.label}</div>`;
    for(const p of picks) {
      const placed = !!STATE.extra[p.id];
      const r = STATE.extra[p.id];
      const profit = r==='W'? p.stake*(p.odds-1) : r==='L'? -p.stake : null;
      html += `<div class="prin-pick-card" style="margin-bottom:8px">
        <div class="prin-pick-top">
          <div class="pick-info">
            <div class="pick-teams" style="font-size:.82rem">${p.partido}</div>
            <div class="pick-bet">${p.bet}</div>
          </div>
          <span class="pick-status ${r==='W'?'win':r==='L'?'loss':'pending'}">${r==='W'?'GANÓ':r==='L'?'PERDIÓ':'⏳'}</span>
          <span class="pick-odds-val">${p.odds.toFixed(2)}</span>
          <div class="result-btns">
            <button class="rbtn win ${r==='W'?'active':''}" onclick="setExtraResult('${p.id}','W')">✓</button>
            <button class="rbtn loss ${r==='L'?'active':''}" onclick="setExtraResult('${p.id}','L')">✗</button>
          </div>
        </div>
        <div class="prin-stake">
          Stake sugerido: <span class="stake-val">${fmt(p.stake)}</span>
          Retorno: <span class="potential-val">${fmt(p.stake*p.odds)}</span>
          ${profit!==null?`<span style="font-weight:600;color:${profit>=0?'var(--grn)':'var(--red)'}">${profit>=0?'+':''}${fmt(profit)}</span>`:''}
          <span class="risk-pill risk-${p.risk}" style="margin-left:4px">${p.risk==='low'?'BAJO':'MEDIO'}</span>
        </div>
        <div style="font-size:.74rem;color:var(--t3);margin-top:5px;padding-top:5px;border-top:1px solid var(--brd)">${p.note}</div>
      </div>`;
    }
  }

  // Resumen potencial
  const allW = EXTRA_PICKS.reduce((s,p)=>s+p.stake*(p.odds-1),0);
  html += `<div style="background:var(--sfc2);border-radius:10px;padding:12px 14px;margin-top:4px">
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;margin-bottom:6px">Si TODAS las combinadas ganan:</div>
    <div style="font-size:.82rem;color:var(--t2)">Ganancia adicional sobre Principal: <strong style="color:var(--grn)">${fmt(allW)}</strong></div>
    <div style="font-size:.82rem;color:var(--t2);margin-top:2px">Banca Principal potencial total: <strong style="color:var(--gold)">${fmt(50000+PRIN_PICKS.reduce((s,p)=>s+p.stake*(p.odds-1),0)+allW)}</strong></div>
  </div>`;

  container.innerHTML = html;
}

// ═══════════════════════════════════════════════════
//  RENDER: GRANDES COMBINADAS 60K / 20K
// ═══════════════════════════════════════════════════
function renderGrandes() {
  const container = document.getElementById('pane-grandes');
  const totalPotencial = BIG_BETS.reduce((s,b)=>{
    const odds = b.picks.reduce((a,p)=>a*p.odds,1);
    return s + b.stake*odds;
  },0);
  const totalStake = BIG_BETS.reduce((s,b)=>s+b.stake,0);

  let html = `
    <div style="background:linear-gradient(135deg,#0B1532,#1A0A30);border:1px solid var(--gbrd);border-radius:12px;padding:16px;margin-bottom:16px;text-align:center">
      <div style="font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:800;color:var(--gold)">COMBINADAS DEL DÍA</div>
      <div style="color:var(--t2);font-size:.82rem;margin-top:4px">Objetivo: más de $500.000 COP por apuesta</div>
      <div style="display:flex;justify-content:center;gap:28px;margin-top:14px">
        <div style="text-align:center">
          <div style="font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:800">${fmt(totalStake)}</div>
          <div style="font-size:.68rem;color:var(--t2)">Total apostado</div>
        </div>
        <div style="text-align:center">
          <div style="font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:800;color:var(--gold)">${fmt(totalPotencial)}</div>
          <div style="font-size:.68rem;color:var(--t2)">Si AMBAS ganan</div>
        </div>
      </div>
    </div>`;

  for(const b of BIG_BETS) {
    const combined = b.picks.reduce((a,p)=>a*p.odds,1);
    const retorno = b.stake * combined;
    const r = STATE.big[b.id];
    html += `
    <div style="background:var(--sfc);border:2px solid ${b.color === 'var(--gold)' ? 'var(--gbrd)' : 'rgba(16,185,129,.35)'};border-radius:12px;margin-bottom:16px;overflow:hidden">
      <div style="background:${b.color === 'var(--gold)' ? 'var(--gsft)' : 'rgba(16,185,129,.08)'};padding:14px 16px;display:flex;align-items:center;gap:12px">
        <div style="flex:1">
          <div style="font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:800;color:${b.color}">${b.label}</div>
          <div style="font-size:.78rem;color:var(--t2);margin-top:2px">${b.picks.length} selecciones · Cuota ${combined.toFixed(2)}×</div>
        </div>
        <div style="text-align:right">
          <div style="font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:800;color:${b.color}">${fmt(b.stake)}</div>
          <div style="font-size:.7rem;color:var(--t2)">Stake</div>
        </div>
      </div>
      <div style="padding:12px 16px">
        ${b.picks.map((p,i)=>`
        <div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--brd)">
          <span style="width:20px;height:20px;border-radius:50%;background:var(--sfc2);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:800;color:var(--t2);flex-shrink:0">${i+1}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:.7rem;color:var(--t3)">${p.partido}</div>
            <div style="font-size:.82rem;font-weight:600">${p.bet}</div>
          </div>
          <span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:.9rem;color:${b.color};flex-shrink:0">${p.odds.toFixed(2)}</span>
        </div>`).join('')}
        <div style="margin-top:12px;background:var(--sfc2);border-radius:8px;padding:12px;display:flex;align-items:center;justify-content:space-between">
          <div>
            <div style="font-size:.72rem;color:var(--t2)">Retorno si gana</div>
            <div style="font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:800;color:${b.color}">${fmt(retorno)}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:.72rem;color:var(--t2);margin-bottom:6px">Resultado</div>
            <div style="display:flex;gap:6px">
              <button class="rbtn win ${r==='W'?'active':''}" style="width:38px;height:38px;font-size:1.1rem" onclick="setBigResult('${b.id}','W')">✓</button>
              <button class="rbtn loss ${r==='L'?'active':''}" style="width:38px;height:38px;font-size:1.1rem" onclick="setBigResult('${b.id}','L')">✗</button>
            </div>
          </div>
        </div>
        ${r ? `<div style="margin-top:8px;text-align:center;font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:1rem;color:${r==='W'?'var(--grn)':'var(--red)'}">
          ${r==='W'?'🏆 GANASTE '+fmt(retorno-b.stake)+' de ganancia':'❌ PERDISTE '+fmt(b.stake)+' de stake'}
        </div>` : ''}
      </div>
    </div>`;
  }

  container.innerHTML = html;
}

function setBigResult(id, val) {
  if(STATE.big[id]===val) delete STATE.big[id];
  else STATE.big[id] = val;
  recalcBancas();
  saveState();
  updateBancaDisplay();
  renderPane('grandes');
}

function setExtraResult(id, val) {
  if(STATE.extra[id]===val) delete STATE.extra[id];
  else STATE.extra[id] = val;
  recalcBancas();
  saveState();
  updateBancaDisplay();
  renderPane('extras');
}

function renderPane(tab) {
  if(tab==='partidos') renderPartidos();
  else if(tab==='analisis') renderAnalisis();
  else if(tab==='reto') renderReto();
  else if(tab==='grandes') renderGrandes();
  else if(tab==='extras') renderExtras();
  else if(tab==='banca') renderBanca();
}

// Override showTab to also re-render
window.showTab = function(tab) {
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('pane-'+tab).classList.add('active');
  event.currentTarget.classList.add('active');
  renderPane(tab);
};

// ═══════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════
recalcBancas();
updateBancaDisplay();
renderPartidos();
renderAnalisis();
renderReto();
renderGrandes();
renderExtras();
renderBanca();
</script>
